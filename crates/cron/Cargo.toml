[package]
name = "genzh-cron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# NOTE: no sqlx, no domain, no control-plane crates. Both binaries schedule
# background work, and the media plane deliberately carries no database driver;
# a scheduler that lived in `genzh-infrastructure` would drag one in.
[dependencies]
tokio.workspace = true
tokio-cron-scheduler.workspace = true
async-trait.workspace = true
parking_lot.workspace = true
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
