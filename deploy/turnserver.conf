# ─────────────────────────────────────────────────────────────────────────────
# Production Coturn TURN & STUN Server Configuration for GenZH
# ─────────────────────────────────────────────────────────────────────────────

# Standard listening ports
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Relay UDP port range for media streams
min-port=49152
max-port=49250

# Authentication mode: Long-term credential mechanism (RFC 5389 / RFC 5766)
lt-cred-mech
fingerprint

# Security & Performance settings
no-cli
no-tls
no-dtls
stale-nonce=600
no-multicast-peers
no-loopback-peers

# Logging
log-file=stdout
simple-log
