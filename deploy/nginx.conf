# Serves the SPA and reverse-proxies the API onto the same origin.
#
# The same-origin part is what makes the image portable. The bundle is built
# with an empty VITE_API_URL, so the browser asks for `/api/v1/...` on
# whatever host it loaded the page from. nginx forwards that to the API
# container. Consequences worth knowing:
#
#   * The image has no server address baked in — one build runs on any IP.
#   * There is no cross-origin request, so CORS_ALLOWED_ORIGINS can stay empty.
#   * The API is not exposed to the internet on its own port unless you
#     publish 8080 yourself.
#
# The media plane is deliberately NOT proxied here. WebRTC needs real UDP
# reachability to the SFU, so clients dial it directly — see MEDIA_SERVER_URL
# in deploy/docker-compose.prod.yml.

# `Connection: upgrade` only when the client actually asked for an upgrade;
# a plain `close` otherwise. Sending `upgrade` unconditionally breaks
# keep-alive on ordinary REST calls. This file is included inside nginx's
# `http` block, so a `map` at this level is valid.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8082;
  server_name _;

  root /usr/share/nginx/html;

  # Docker's embedded DNS. Resolving at request time rather than at startup
  # means nginx survives the API container being restarted or recreated with
  # a new IP — with a literal `proxy_pass http://api:8080` it would cache the
  # first address forever and 502 until reloaded.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    # A variable in proxy_pass drops the URI, so it is re-appended by hand.
    set $api_upstream http://api:8080;
    proxy_pass $api_upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # /api/v1/ws is a WebSocket. Without these two headers the upgrade never
    # happens and real-time chat silently falls back to nothing.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The chat socket is long-lived and mostly idle. The 60s default would
    # cut it every minute and make the client reconnect in a loop.
    proxy_read_timeout  1h;
    proxy_send_timeout  1h;

    # Server-sent updates should reach the browser when they happen.
    proxy_buffering off;
  }

  location /assets/ {
    # Vite fingerprints these filenames, so a stale copy is impossible.
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page application: every client route must fall back to index.html,
  # or a refresh on /c/<id>/r/<id> is a 404 from nginx rather than a page.
  location / {
    try_files $uri $uri/ /index.html;

    # index.html itself must never be cached, or browsers keep loading a
    # bundle whose fingerprinted assets no longer exist after a deploy.
    add_header Cache-Control "no-cache";
  }
}
