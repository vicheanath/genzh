# Production stack. Pulls images built by CI; builds nothing on the server.
#
# ── Pointing it at a server ──────────────────────────────────────────────
#
# Exactly one variable has to know where the box is: DEPLOY_HOST. Everything
# a browser dials is derived from it.
#
#   DEPLOY_HOST=203.0.113.10  docker compose -f docker-compose.prod.yml up -d
#
# The web bundle itself is host-agnostic — it calls /api on its own origin and
# nginx proxies that to the API container — so the only other thing
# DEPLOY_HOST feeds is LiveKit's node_ip, the address a browser must be able
# to dial directly for WebRTC. That one is not an environment variable —
# `deploy.sh` writes it into livekit.yaml from livekit.yaml.template, because
# LiveKit's config needs a real IP there, not a URL.

name: genzh

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-social}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-social}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Deliberately not published. The API reaches it over the compose network;
    # a published 5432 on a public IP is an open invitation.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-social} -d ${POSTGRES_DB:-social}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE_API:?set IMAGE_API}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-social}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-social}
      RUN_MIGRATIONS: "true"
      API_BIND: 0.0.0.0:8080

      APP_ENV: ${APP_ENV:-production}
      # Explicit, because it defaults to false when APP_ENV is production and
      # a fresh box then has no way to create the first account until OAuth
      # credentials exist. Set it to false once Google/Discord are configured.
      ALLOW_PASSWORD_SIGNUP: ${ALLOW_PASSWORD_SIGNUP:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://${DEPLOY_HOST}}

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-}

      # Optional. Blank turns the composer's GIF button off rather than
      # failing: `/api/v1/auth/config` reports `features.gifs: false` and the
      # clients do not offer it.
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}

      # This process signs LiveKit access tokens with the same key/secret
      # LiveKit itself verifies with (see the livekit service below).
      # LIVEKIT_URL is the address a *browser* dials — DEPLOY_HOST is checked
      # by the caller rather than with `:?` here, for the same reason
      # MEDIA_SERVER_URL was before it: an empty value would silently produce
      # `ws://:7880`, which fails only later and only for voice.
      # `deploy/deploy.sh` refuses to run without it.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://${DEPLOY_HOST}:7880}

      # Empty is correct here: the browser and the API share an origin through
      # the nginx proxy, so no cross-origin request is ever made.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      STUN_URL: ${STUN_URL:-stun:${DEPLOY_HOST}:3478}
      TURN_URL: ${TURN_URL:-turn:${DEPLOY_HOST}:3478?transport=udp}
      TURN_USERNAME: ${TURN_USERNAME:-genzh}
      TURN_PASSWORD: ${TURN_PASSWORD:-${MEDIA_TOKEN_SECRET}}

      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # Not published either — nginx in the web container is the only thing that
    # needs to reach it. Publish it only if a mobile client must call the API
    # directly, in which case CORS_ALLOWED_ORIGINS has to be set too.
    expose:
      - "8080"

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      # The only secret this process gets. No database URL, no JWT key: a
      # compromised SFU must not be able to forge user sessions.
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET}
      MEDIA_BIND: 0.0.0.0:8081
      MEDIA_UDP_BIND: 0.0.0.0:0

      STUN_URL: ${STUN_URL:-stun:${DEPLOY_HOST}:3478}
      TURN_URL: ${TURN_URL:-turn:${DEPLOY_HOST}:3478?transport=udp}
      TURN_USERNAME: ${TURN_USERNAME:-genzh}
      TURN_PASSWORD: ${TURN_PASSWORD:-${MEDIA_TOKEN_SECRET}}

      RUST_LOG: ${RUST_LOG:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    # WebRTC needs UDP that actually reaches the peer, and bridge NAT does not
    # provide it. On a Linux server host networking is the honest answer: the
    # SFU binds the host's interfaces and advertises addresses a client can
    # really dial. Both MEDIA_BIND (8081/tcp) and the UDP ports come with it,
    # so no `ports:` mapping is needed — or possible.
    network_mode: host

  turn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - "turnserver"
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${TURN_REALM:-${DEPLOY_HOST}}"
      - "--user=${TURN_USERNAME:-genzh}:${TURN_PASSWORD:-${MEDIA_TOKEN_SECRET}}"
      - "--external-ip=${DEPLOY_HOST}"
    # Host network mode allows Coturn to bind directly to 3478 and the relay UDP ports.
    network_mode: host

  web:
    image: ${IMAGE_WEB:?set IMAGE_WEB}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Port 80 on the host, so the site is just http://<DEPLOY_HOST>/ with
      # no port in the URL. Put a TLS terminator in front for https.
      - "${WEB_PORT:-80}:8082"

volumes:
  postgres-data:
