# Local development stack: PostgreSQL, the API, LiveKit (media), and the web frontend.
#
# LiveKit handles WebRTC media routing. No custom SFU, no Redis, no message broker,
# no service mesh — each service is a component that has to be understood, operated
# and debugged. They can be added when there is a workload that needs them; the
# architecture leaves room (see README).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns healthy before the database can actually serve, so
      # the API must tolerate a not-yet-ready database anyway — which it does,
      # by connecting lazily and reporting through /ready.
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The seed binary signs its own JWTs with a fixed development secret
      # and never touches LiveKit config — it only needs a database.
      DATABASE_URL: postgres://social:social@postgres:5432/social
      RUST_LOG: info
    profiles:
      - init

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://social:social@postgres:5432/social
      RUN_MIGRATIONS: "true"
      API_BIND: 0.0.0.0:8080

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET in .env}

      # Required by Config::from_env — the process refuses to start without
      # them. This block went stale when media moved to LiveKit: compose still
      # passed only the old MEDIA_* pair, so `docker compose up api` died at
      # startup with "LIVEKIT_API_KEY must be set" before serving anything.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
      # The address a *browser* dials, not the compose-internal hostname.
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}

      # Optional. Blank turns the composer's GIF button off rather than
      # failing: /api/v1/auth/config reports features.gifs false and the
      # clients do not offer it.
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}

      # How clients reach the media server. This is the address a *browser*
      # dials, not a compose-internal hostname.
      MEDIA_SERVER_URL: ${MEDIA_SERVER_URL:-ws://127.0.0.1:8081/ws/media}

      STUN_URL: ${STUN_URL:-stun:127.0.0.1:3478}
      TURN_URL: ${TURN_URL:-turn:127.0.0.1:3478?transport=udp}
      TURN_USERNAME: ${TURN_USERNAME:-genzh}
      TURN_PASSWORD: ${TURN_PASSWORD:-secretpass}

      RUST_LOG: ${RUST_LOG:-info,api=debug}
    ports:
      - "8080:8080"

  media:
    build:
      context: .
      dockerfile: Dockerfile.media
    environment:
      # The *only* secret this process gets. No database, no user JWT key.
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET in .env}
      MEDIA_BIND: 0.0.0.0:8081

      STUN_URL: ${STUN_URL:-stun:127.0.0.1:3478}
      TURN_URL: ${TURN_URL:-turn:127.0.0.1:3478?transport=udp}
      TURN_USERNAME: ${TURN_USERNAME:-genzh}
      TURN_PASSWORD: ${TURN_PASSWORD:-secretpass}

      RUST_LOG: ${RUST_LOG:-info,media=debug}
    ports:
      - "8081:8081"
      # Pinning the UDP range makes bridge networking workable. On Linux,
      # `network_mode: host` is simpler and faster; on Docker Desktop it is not
      # available, so this is the portable option.
      - "40000-40100:40000-40100/udp"

  turn:
    image: coturn/coturn:alpine
    restart: unless-stopped
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked into the bundle at build time — see Dockerfile.web.
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8080}
    depends_on:
      - api
    ports:
      - "8082:8082"

  # LiveKit: the media server. Every voice/video/screen-share connection goes
  # through it; the API never touches RTP.
  #
  # LIVEKIT_KEYS is LiveKit's documented env-var form of the `keys:` config
  # block (`"<api-key>: <api-secret>"`), layered on top of the mounted
  # livekit.yaml — which exists only to pin the RTC UDP port range to
  # something small enough for Docker Desktop's Windows port-forwarding to
  # actually bind. See livekit.yaml for why; the port list below must match
  # it exactly, or ICE will fail with no visible error — the join and the
  # token grant both look fine, audio/video just never connects.
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      LIVEKIT_LOG_LEVEL: debug
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      # WebRTC signalling, over WebSocket (clients connect here)
      - "7880:7880"
      # ICE over TCP — `rtc.tcp_port` in livekit.yaml, not an HTTP API. It is
      # the fallback a client falls back *to* when UDP is blocked, which is
      # the difference between "no media" and "media, slightly worse" on a
      # phone whose network filters the RTP range.
      - "7881:7881"
      # Real RTP media. Must match rtc.port_range_start/end in livekit.yaml.
      - "50000-50019:50000-50019/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
