# Local development stack: PostgreSQL, the API, LiveKit (media), and the web frontend.
#
# LiveKit handles WebRTC media routing. No custom SFU, no Redis, no message broker,
# no service mesh — each service is a component that has to be understood, operated
# and debugged. They can be added when there is a workload that needs them; the
# architecture leaves room (see README).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns healthy before the database can actually serve, so
      # the API must tolerate a not-yet-ready database anyway — which it does,
      # by connecting lazily and reporting through /ready.
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://social:social@postgres:5432/social
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET in .env}
      RUST_LOG: info
    profiles:
      - init

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://social:social@postgres:5432/social
      RUN_MIGRATIONS: "true"
      API_BIND: 0.0.0.0:8080

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:?set MEDIA_TOKEN_SECRET in .env}

      # How clients reach the media server. This is the address a *browser*
      # dials, not a compose-internal hostname.
      STUN_URL: ${STUN_URL:-stun:stun.l.google.com:19302}
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_PASSWORD: ${TURN_PASSWORD:-}

      # LiveKit configuration
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}

      RUST_LOG: ${RUST_LOG:-info,api=debug}
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked into the bundle at build time — see Dockerfile.web.
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8080}
    depends_on:
      - api
    ports:
      - "8082:8082"

  # LiveKit: WebRTC media server (handles peer connections, media routing, etc.)
  # All voice/video connections go through LiveKit
  # Note: UDP ports disabled on Windows Docker Desktop; WebSocket fallback used instead
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.conf.yaml
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_LOG_LEVEL: debug
    ports:
      # WebRTC over WebSocket (clients connect here)
      - "7880:7880"
      # HTTP API
      - "7881:7881"
      # UDP media ports disabled for Windows compatibility
      # On Linux or Mac, uncomment to enable: - "50000-60000:50000-60000/udp"
    volumes:
      - livekit-data:/livekit
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7881/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  livekit-data:
