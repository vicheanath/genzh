# Local development stack: PostgreSQL, the API, LiveKit (media), and the web frontend.
#
# LiveKit handles WebRTC media routing. No custom SFU, no Redis, no message broker,
# no service mesh — each service is a component that has to be understood, operated
# and debugged. They can be added when there is a workload that needs them; the
# architecture leaves room (see README).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` returns healthy before the database can actually serve, so
      # the API must tolerate a not-yet-ready database anyway — which it does,
      # by connecting lazily and reporting through /ready.
      test: ["CMD-SHELL", "pg_isready -U social -d social"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build:
      context: .
      dockerfile: Dockerfile.seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The seed binary signs its own JWTs with a fixed development secret
      # and never touches LiveKit config — it only needs a database.
      DATABASE_URL: postgres://social:social@postgres:5432/social
      RUST_LOG: info
    profiles:
      - init

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://social:social@postgres:5432/social
      RUN_MIGRATIONS: "true"
      API_BIND: 0.0.0.0:8080

      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}

      # LiveKit: this process signs access tokens with the same key/secret
      # LiveKit verifies with. LIVEKIT_URL is the address a *browser* dials —
      # a compose-internal hostname would not resolve outside the network, so
      # this must be reachable from wherever the web client runs.
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://127.0.0.1:7880}

      RUST_LOG: ${RUST_LOG:-info,api=debug}
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # Baked into the bundle at build time — see Dockerfile.web.
        VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8080}
    depends_on:
      - api
    ports:
      - "8082:8082"

  # LiveKit: the media server. Every voice/video/screen-share connection goes
  # through it; the API never touches RTP.
  #
  # No mounted config file — LIVEKIT_KEYS is LiveKit's documented env-var
  # form of the `keys:` config block (`"<api-key>: <api-secret>"`), so the
  # image needs nothing but environment.
  #
  # Note: UDP media ports are disabled below for Windows Docker Desktop,
  # which refuses to bind a UDP range from inside this tool's sandbox.
  # LiveKit falls back to TCP/WebSocket relay, which works everywhere but
  # costs some latency under real load. On Linux or macOS, uncomment the UDP
  # range for direct media.
  livekit:
    image: livekit/livekit-server:latest
    command: --bind 0.0.0.0
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-secret}"
      LIVEKIT_LOG_LEVEL: debug
    ports:
      # WebRTC signalling, over WebSocket (clients connect here)
      - "7880:7880"
      # HTTP API (room/egress management)
      - "7881:7881"
      # UDP media ports disabled for Windows Docker Desktop compatibility.
      # - "50000-60000:50000-60000/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
