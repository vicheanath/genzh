<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>genzh</title>
    <!-- The display face (--font-display). Body copy stays on the system UI
         stack, so a slow font never blocks the app from being readable.
         Bricolage is variable on two axes: `wght` for weight and `opsz` for
         optical size, which is what lets one file serve an 11px overline and a
         4rem empty-state headline without either looking like the other
         stretched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap"
    />
    <!-- Faces sold as name cosmetics. Loaded lazily — nothing in the app's own
         chrome is set in these, so a name that arrives a beat late in its bought
         typeface costs nothing, while blocking first paint on eight display
         faces would cost plenty. The `print`/`onload` swap is what makes the
         browser fetch it without treating it as render-blocking. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Bungee+Shade&family=Cinzel:wght@600;700&family=Creepster&family=Fredoka:wght@600;700&family=MedievalSharp&family=Monoton&family=Neonderthaw&family=Orbitron:wght@600;800&family=Pacifico&family=Permanent+Marker&family=Press+Start+2P&family=Righteous&family=Rubik+Glitch&family=Sedgwick+Ave&family=Silkscreen:wght@400;700&family=Syne:wght@700;800&family=UnifrakturMaguntia&family=VT323&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Bungee+Shade&family=Cinzel:wght@600;700&family=Creepster&family=Fredoka:wght@600;700&family=MedievalSharp&family=Monoton&family=Neonderthaw&family=Orbitron:wght@600;800&family=Pacifico&family=Permanent+Marker&family=Press+Start+2P&family=Righteous&family=Rubik+Glitch&family=Sedgwick+Ave&family=Silkscreen:wght@400;700&family=Syne:wght@700;800&family=UnifrakturMaguntia&family=VT323&display=swap"
      />
    </noscript>
    <!-- Khmer display face. Lazy-loaded so it never blocks first paint for
         English users. Noto Sans Khmer covers the full Unicode Khmer block
         and renders cleanly at every size the app uses. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <script>
      // Apply the stored theme before first paint, so a dark-mode user never
      // sees a white flash while the bundle loads.
      try {
        const stored = localStorage.getItem('theme')
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored)
        }
      } catch {}
      // Restore the display language so :lang(km) CSS rules activate before
      // the bundle runs, preventing a flash of Latin text for Khmer users.
      try {
        const locale = localStorage.getItem('locale')
        if (locale) document.documentElement.lang = locale
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
