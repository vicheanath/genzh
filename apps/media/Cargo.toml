[package]
name = "media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# NOTE: deliberately no sqlx and no control-plane crates. `genzh-cron` is safe
# to take because it carries neither — that is why it is not a module of
# `genzh-infrastructure`.
[dependencies]
genzh-media-core.workspace = true
genzh-media-room.workspace = true
genzh-media-signaling.workspace = true
genzh-cron.workspace = true
chrono.workspace = true

axum.workspace = true
tower-http.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
dotenvy.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
