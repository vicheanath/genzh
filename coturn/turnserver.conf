# ─────────────────────────────────────────────────────────────────────────────
# Coturn TURN & STUN Server Configuration for GenZH
# ─────────────────────────────────────────────────────────────────────────────

# Listening ports for plain STUN/TURN (TCP & UDP)
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 listens on all interfaces)
listening-ip=0.0.0.0

# Relay IP (traffic forwarded to peers comes from this IP)
# In production on a public VPS, set to the public IP if behind NAT:
# external-ip=YOUR_PUBLIC_IP

# Relay UDP port range for media streams
min-port=49152
max-port=49200

# Authentication mode: Long-term credential mechanism (RFC 5389 / RFC 5766)
lt-cred-mech
fingerprint

# Default realm (domain/host for authentication realm)
realm=genzh.local

# Static credentials for development / standalone instances
# In production, change to secure random password or configure static-auth-secret
user=genzh:secretpass

# Security & Anti-abuse
no-cli
no-tls
no-dtls
stale-nonce=600

# Logging
log-file=stdout
simple-log
verbose
